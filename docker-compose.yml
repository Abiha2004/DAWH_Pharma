# Pharma Cold-Chain DWH - Phase 1 (SDI) stack
#   postgres        :5432  DWH (bronze/silver/gold/mart/ops) + Airflow metadata
#   airflow-web     :8080  Airflow UI + REST API (admin / admin)
#   airflow-sched          scheduler (LocalExecutor)
#   file-watcher           watchdog on data/landing -> triggers sdi_01_batch_ingestion
#   ingest-api      :8000  FastAPI ingestion API (docs at /docs)
#   grafana         :3000  Data-engineering dashboards (admin / admin)
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: pharma-dwh-airflow:phase1
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    PROJECT_ROOT: /opt/airflow/project
    DWH_DB_HOST: postgres
    DWH_DB_PORT: "5432"
    DWH_DB_NAME: ${DWH_DB_NAME:-pharma_dwh}
    DWH_DB_USER: ${POSTGRES_USER:-postgres}
    DWH_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    INGEST_API_URL: http://ingest-api:8000
    AIRFLOW_API_URL: http://airflow-webserver:8080/api/v1
    AIRFLOW_API_USER: ${AIRFLOW_ADMIN_USER:-admin}
    AIRFLOW_API_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/project/src
    - ./sql:/opt/airflow/project/sql
    - ./config:/opt/airflow/project/config
    - ./data:/opt/airflow/project/data
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${DWH_DB_NAME:-pharma_dwh}
    command: >
      postgres -c shared_preload_libraries=pg_stat_statements
               -c pg_stat_statements.track=all
               -c max_wal_size=2GB -c shared_buffers=512MB -c work_mem=64MB
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${DWH_DB_NAME:-pharma_dwh}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: >
      -c "airflow db migrate &&
          airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
            --firstname Admin --lastname DWH --role Admin --email admin@example.com || true &&
          python -m src.pipeline init"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8080:8080"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  file-watcher:
    <<: *airflow-common
    entrypoint: ["python", "-m", "src.ingestion.file_watcher"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ingest-api:
    <<: *airflow-common
    entrypoint: ["uvicorn", "src.ingestion.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/00_pipeline_overview.json
      GF_USERS_DEFAULT_THEME: light
    ports: ["3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  airflow-logs:
  grafana-data:
